name: InworldTranslator
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  developmentLanguage: en

packages:
  TranslatorCore:
    path: Packages/TranslatorCore

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_UPCOMING_FEATURE_EXISTENTIAL_ANY: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES

targets:
  InworldTranslator:
    type: application
    platform: iOS
    configFiles:
      Debug: App/Config/App.xcconfig
      Release: App/Config/App.xcconfig
    sources:
      - App/Sources
    dependencies:
      - package: TranslatorCore
        product: TranslatorCore
    info:
      path: App/Sources/Info.plist
      properties:
        CFBundleDisplayName: Translator
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        NSMicrophoneUsageDescription: Translator listens to the people around you and shows what they say in English.
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Default Configuration
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).SceneDelegate
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES

  InworldTranslatorTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - App/Tests
    dependencies:
      - target: InworldTranslator
    settings:
      base:
        BUNDLE_LOADER: $(TEST_HOST)
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/InworldTranslator.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/InworldTranslator
        GENERATE_INFOPLIST_FILE: YES

  # Needs the mock server and audio samples; see App/UITests.
  InworldTranslatorUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - App/UITests
    dependencies:
      - target: InworldTranslator
    settings:
      base:
        TEST_TARGET_NAME: InworldTranslator
        GENERATE_INFOPLIST_FILE: YES

schemes:
  InworldTranslator:
    build:
      targets:
        InworldTranslator: all
        InworldTranslatorTests: [test]
    test:
      targets:
        - InworldTranslatorTests
        - package: TranslatorCore/TranslatorCoreTests
    run:
      config: Debug

  InworldTranslatorUITests:
    build:
      targets:
        InworldTranslator: all
        InworldTranslatorUITests: [test]
    test:
      targets:
        - InworldTranslatorUITests
